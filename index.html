<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows XP Professional</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Wallpaper Asli Windows XP Bliss */
    #desktop {
      width: 100vw;
      height: calc(100vh - 30px);
      background: url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 10px;
      display: grid;
      grid-template-rows: repeat(auto-fill, 75px);
      grid-auto-flow: column;
      grid-auto-columns: 80px;
      gap: 15px;
    }

    /* Icon Desktop XP */
    .desktop-icon {
      width: 75px;
      height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 2px #000;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 3px;
    }
    .desktop-icon:hover {
      background: rgba(49, 106, 197, 0.4);
      border-color: rgba(49, 106, 197, 0.8);
    }
    .desktop-icon i {
      font-size: 32px;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.6));
    }
    .desktop-icon span {
      font-size: 11px;
      margin-top: 3px;
      line-height: 1.1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Taskbar Windows XP */
    #taskbar {
      width: 100vw;
      height: 30px;
      background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #245edb 92%, #1941a5 100%);
      position: fixed;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10000;
      border-top: 1px solid #4889f5;
    }

    /* Start Button Hijau Khas XP */
    #start-btn {
      height: 30px;
      width: 100px;
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 15%, #2e7d32 85%, #1b5e20 100%);
      border-radius: 0 12px 12px 0;
      box-shadow: 2px 0 5px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      color: white;
      font-weight: bold;
      font-style: italic;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    #start-btn:hover {
      filter: brightness(1.1);
    }

    .taskbar-apps {
      flex: 1;
      display: flex;
      padding-left: 8px;
      gap: 5px;
    }

    /* System Tray Biru Khas XP */
    #system-tray {
      height: 100%;
      background: linear-gradient(to bottom, #0c82dc 0%, #159df5 10%, #0d79cc 90%, #055a9e 100%);
      border-left: 1px solid #084074;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      color: white;
      font-size: 11px;
      box-shadow: inset 1px 0 2px rgba(0,0,0,0.3);
    }

    .tray-icons {
      display: flex;
      gap: 6px;
      font-size: 13px;
    }

    #tray-clock {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 2px;
    }
    #tray-clock:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Start Menu XP 2-Kolom */
    #start-menu {
      width: 380px;
      height: 440px;
      position: fixed;
      bottom: 30px;
      left: 0;
      background: #fff;
      border-radius: 5px 5px 0 0;
      box-shadow: 3px 3px 15px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      z-index: 9999;
      border: 1px solid #0055ea;
      overflow: hidden;
    }
    #start-menu.open {
      display: flex;
    }

    /* Start Menu Header */
    .start-user {
      height: 52px;
      background: linear-gradient(to bottom, #1d5ad6 0%, #2f79ee 100%);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 1px 1px 2px #000;
      border-bottom: 2px solid #e58d17;
    }
    .start-user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 4px;
      border: 2px solid #fff;
      background: #ffaa00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Start Menu Body */
    .start-body {
      flex: 1;
      display: flex;
      background: #d3e5fa;
    }
    .start-left {
      width: 50%;
      background: #ffffff;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }
    .start-right {
      width: 50%;
      background: #d3e5fa;
      padding: 6px;
      border-left: 1px solid #9bbde7;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    .start-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 11px;
      color: #333;
      text-decoration: none;
    }
    .start-item:hover {
      background: #2f71cd;
      color: white !important;
    }
    .start-item:hover span {
      color: white !important;
    }
    .start-item i {
      font-size: 16px;
      min-width: 18px;
      text-align: center;
    }
    .start-item .bold-text {
      font-weight: bold;
      display: block;
      color: #000;
    }

    /* Start Menu Footer */
    .start-footer {
      height: 40px;
      background: linear-gradient(to bottom, #3878e4 0%, #1f5ed8 100%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
      gap: 10px;
      border-top: 1px solid #5a93ee;
    }
    .footer-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      color: white;
      font-size: 11px;
      cursor: pointer;
      padding: 3px 6px;
    }
    .footer-btn:hover {
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
    }

    /* Jendela Pop-up XP */
    .xp-window {
      position: absolute;
      top: 40px;
      left: 80px;
      width: 880px;
      height: 520px;
      background: #ECE9D8;
      border: 3px solid #0055ea;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      z-index: 100;
    }
    .xp-titlebar {
      height: 26px;
      background: linear-gradient(to bottom, #0058ee 0%, #3593ff 4%, #288eff 6%, #0058ee 8%, #003dd7 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      color: white;
      font-weight: bold;
      font-size: 12px;
      text-shadow: 1px 1px 1px #000;
    }
    .xp-controls {
      display: flex;
      gap: 3px;
    }
    .xp-btn {
      width: 18px;
      height: 18px;
      border: 1px solid #fff;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }
    .xp-btn.min { background: linear-gradient(#2a6be8, #0b45b2); }
    .xp-btn.max { background: linear-gradient(#2a6be8, #0b45b2); }
    .xp-btn.close { background: linear-gradient(#e05338, #b02409); }

    .xp-body {
      flex: 1;
      background: #fff;
      position: relative;
    }
    .xp-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Pop-up Kalender Jam */
    #calendar-popup {
      position: fixed;
      bottom: 35px;
      right: 5px;
      width: 240px;
      background: #fff;
      border: 1px solid #0055ea;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      padding: 10px;
      z-index: 10001;
      font-size: 12px;
    }
    #calendar-popup.open {
      display: flex;
    }
    .cal-header {
      background: #245edb;
      color: white;
      text-align: center;
      padding: 4px;
      font-weight: bold;
      border-radius: 2px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body onclick="handleGlobalClick()">

  <!-- Suara Startup Asli Windows XP -->
  <audio id="xp-startup" preload="auto">
    <source src="https://www.myinstants.com/media/sounds/windows-xp-startup.mp3" type="audio/mpeg">
  </audio>

  <!-- Area Desktop Bliss -->
  <div id="desktop">
    <!-- Recycle Bin Asli -->
    <div class="desktop-icon" style="position: absolute; right: 15px; bottom: 45px;" ondblclick="alert('Recycle Bin Kosong')">
      <i class="bi bi-trash3-fill" style="color: #4da6ff;"></i>
      <span>Recycle Bin</span>
    </div>
  </div>

  <!-- Start Menu XP -->
  <div id="start-menu" onclick="event.stopPropagation()">
    <div class="start-user">
      <div class="start-user-avatar"><i class="bi bi-person-fill"></i></div>
      <span>Administrator</span>
    </div>
    
    <div class="start-body">
      <!-- Kolom Kiri -->
      <div class="start-left" id="start-left-list"></div>
      <!-- Kolom Kanan -->
      <div class="start-right" id="start-right-list"></div>
    </div>

    <div class="start-footer">
      <div class="footer-btn" onclick="playSound()"><i class="bi bi-key-fill" style="color:#f2aa00;"></i> Log Off</div>
      <div class="footer-btn" onclick="alert('Shutting Down Windows...')"><i class="bi bi-power" style="color:#d83b01;"></i> Turn Off Computer</div>
    </div>
  </div>

  <!-- Kalender Popup Samping Jam -->
  <div id="calendar-popup" onclick="event.stopPropagation()">
    <div class="cal-header" id="cal-date-title">Date & Time</div>
    <div style="text-align: center; margin: 5px 0;">
      <b id="cal-time-big" style="font-size: 18px; color: #1941a5;"></b>
    </div>
    <div style="text-align: center; color: #555;" id="cal-full-date"></div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div id="start-btn" onclick="toggleStartMenu(event)">
      <i class="bi bi-windows" style="font-size: 16px;"></i>
      <span>start</span>
    </div>

    <div class="taskbar-apps" id="taskbar-opened-apps"></div>

    <!-- Notification Tray -->
    <div id="system-tray">
      <div class="tray-icons">
        <i class="bi bi-shield-fill-check" style="color: #ffcc00;" title="Windows Security Alerts"></i>
        <i class="bi bi-volume-up-fill" title="Volume" onclick="playSound()"></i>
        <i class="bi bi-usb-drive-fill" title="Safely Remove Hardware"></i>
      </div>
      <div id="tray-clock" onclick="toggleCalendar(event)">12:00 PM</div>
    </div>
  </div>

  <script>
    // 14 Menu yang Diinput
    const leftMenus = [
      { name: "Index / Beranda", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=index", icon: "bi-house-door-fill", color: "#1976d2" },
      { name: "Dashboard Utama", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard", icon: "bi-speedometer2", color: "#e65100" },
      { name: "Input Kerusakan", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=kerusakan", icon: "bi-exclamation-triangle-fill", color: "#c62828" },
      { name: "Jadwal Kerusakan", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=jadwal-kerusakan", icon: "bi-calendar-x-fill", color: "#ad1457" },
      { name: "PLTS Dashboard", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=plts-dashboard", icon: "bi-sun-fill", color: "#f57f17" },
      { name: "Energi Dashboard", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=energi-dashboard", icon: "bi-lightning-charge-fill", color: "#2e7d32" },
      { name: "BAST Form", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=bast", icon: "bi-file-earmark-check-fill", color: "#00695c" }
    ];

    const rightMenus = [
      { name: "Dashboard BAST", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-bast", icon: "bi-card-checklist", color: "#00838f" },
      { name: "Dashboard ATM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-atm", icon: "bi-cash-coin", color: "#4527a0" },
      { name: "Perencanaan PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=perencanaan-pm", icon: "bi-calendar2-range-fill", color: "#1565c0" },
      { name: "Progres Jadwal PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=progres-jadwal-pm", icon: "bi-clock-history", color: "#6a1b9a" },
      { name: "Dashboard PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-pm", icon: "bi-pie-chart-fill", color: "#c2185b" },
      { name: "Checklist Harian PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=checklist-harian-pm", icon: "bi-ui-checks", color: "#00796b" },
      { name: "Dashboard Checklist", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-checklist-pm", icon: "bi-bar-chart-line-fill", color: "#283593" }
    ];

    const allMenus = [...leftMenus, ...rightMenus];

    // Render Desktop Icons
    const desktop = document.getElementById('desktop');
    allMenus.forEach(item => {
      const el = document.createElement('div');
      el.className = 'desktop-icon';
      el.ondblclick = () => openWindow(item);
      el.innerHTML = `<i class="bi ${item.icon}" style="color:${item.color}"></i><span>${item.name}</span>`;
      desktop.appendChild(el);
    });

    // Render Start Menu
    const leftList = document.getElementById('start-left-list');
    leftMenus.forEach(item => {
      const el = document.createElement('div');
      el.className = 'start-item';
      el.onclick = () => { openWindow(item); closeAllPopups(); };
      el.innerHTML = `<i class="bi ${item.icon}" style="color:${item.color}"></i><span class="bold-text">${item.name}</span>`;
      leftList.appendChild(el);
    });

    const rightList = document.getElementById('start-right-list');
    rightMenus.forEach(item => {
      const el = document.createElement('div');
      el.className = 'start-item';
      el.onclick = () => { openWindow(item); closeAllPopups(); };
      el.innerHTML = `<i class="bi ${item.icon}" style="color:${item.color}"></i><span><b>${item.name}</b></span>`;
      rightList.appendChild(el);
    });

    // Window Management
    let winZ = 100;
    function openWindow(app) {
      winZ++;
      const id = 'win_' + Math.random().toString(36).substr(2, 7);
      const win = document.createElement('div');
      win.className = 'xp-window';
      win.id = id;
      win.style.zIndex = winZ;
      win.style.top = `${50 + (winZ % 8) * 20}px`;
      win.style.left = `${60 + (winZ % 8) * 20}px`;

      win.innerHTML = `
        <div class="xp-titlebar">
          <div style="display:flex; align-items:center; gap:5px;">
            <i class="bi ${app.icon}"></i> <span>${app.name}</span>
          </div>
          <div class="xp-controls">
            <div class="xp-btn min" onclick="minimizeWin('${id}')">_</div>
            <div class="xp-btn max" onclick="maximizeWin('${id}')">□</div>
            <div class="xp-btn close" onclick="closeWin('${id}')">✕</div>
          </div>
        </div>
        <div class="xp-body">
          <iframe src="${app.url}"></iframe>
        </div>
        <div style="background:#f0f0f0; padding:3px 8px; font-size:11px; display:flex; justify-content:flex-end; border-top:1px solid #ccc;">
          <a href="${app.url}" target="_blank" style="color:#0055ea; text-decoration:none;">Buka Link Eksternal ↗</a>
        </div>
      `;

      win.onmousedown = () => { win.style.zIndex = ++winZ; };
      document.body.appendChild(win);
    }

    function closeWin(id) { document.getElementById(id)?.remove(); }
    function minimizeWin(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }
    function maximizeWin(id) {
      const el = document.getElementById(id);
      if (el.style.width === '100vw') {
        el.style.width = '880px';
        el.style.height = '520px';
        el.style.top = '40px';
        el.style.left = '80px';
      } else {
        el.style.width = '100vw';
        el.style.height = 'calc(100vh - 30px)';
        el.style.top = '0';
        el.style.left = '0';
      }
    }

    // Toggle & Popups
    function toggleStartMenu(e) {
      e.stopPropagation();
      document.getElementById('calendar-popup').classList.remove('open');
      document.getElementById('start-menu').classList.toggle('open');
    }

    function toggleCalendar(e) {
      e.stopPropagation();
      document.getElementById('start-menu').classList.remove('open');
      document.getElementById('calendar-popup').classList.toggle('open');
    }

    function closeAllPopups() {
      document.getElementById('start-menu').classList.remove('open');
      document.getElementById('calendar-popup').classList.remove('open');
    }

    function handleGlobalClick() {
      closeAllPopups();
      playStartupOnce();
    }

    // Jam & Kalender
    function updateTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('tray-clock').innerText = timeStr;
      document.getElementById('cal-time-big').innerText = now.toLocaleTimeString();
      document.getElementById('cal-full-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('cal-date-title').innerText = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Sound Engine
    let played = false;
    function playStartupOnce() {
      if (!played) {
        playSound();
        played = true;
      }
    }
    function playSound() {
      const snd = document.getElementById('xp-startup');
      snd.currentTime = 0;
      snd.play().catch(() => {});
    }
  </script>
</body>
</html>
