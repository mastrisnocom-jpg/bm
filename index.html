<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Web Portal</title>
  <!-- Bootstrap Icons & Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Wallpaper Asli Windows 11 */
    #desktop {
      width: 100vw;
      height: calc(100vh - 48px);
      background: url('https://images.wallpapersden.com/image/download/windows-11-default-bloom_bWhmaWuUmZqaraWkpJRmbmdlrWZlbWU.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 15px;
      display: grid;
      grid-template-rows: repeat(auto-fill, 90px);
      grid-auto-flow: column;
      grid-auto-columns: 95px;
      gap: 12px;
      z-index: 1;
    }

    /* Shortcut Icon di Desktop */
    .desktop-icon {
      width: 90px;
      height: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 6px;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      padding: 5px;
    }

    .desktop-icon:hover {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }

    .desktop-icon:active {
      transform: scale(0.95);
    }

    .desktop-icon i {
      font-size: 32px;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .desktop-icon span {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Taskbar Windows 11 */
    #taskbar {
      width: 100vw;
      height: 48px;
      background: rgba(243, 243, 243, 0.85);
      backdrop-filter: blur(25px);
      position: fixed;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-shadow: 0 -1px 10px rgba(0,0,0,0.15);
      z-index: 9999;
    }

    .taskbar-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }

    .taskbar-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
      color: #333;
      transition: background 0.2s;
    }

    .taskbar-btn:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    .start-btn {
      color: #0078d4;
    }

    .taskbar-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 12px;
      color: #222;
      font-weight: 500;
    }

    /* Start Menu */
    #start-menu {
      width: 580px;
      height: 520px;
      background: rgba(245, 245, 245, 0.92);
      backdrop-filter: blur(30px);
      position: fixed;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      padding: 20px;
      display: none;
      flex-direction: column;
      z-index: 9998;
      border: 1px solid rgba(255,255,255,0.4);
      transition: all 0.25s ease-out;
      opacity: 0;
    }

    #start-menu.open {
      display: flex;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .start-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #444;
    }

    .start-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .start-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .start-item:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    .start-item i {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .start-item span {
      font-size: 11px;
      color: #333;
      font-weight: 500;
      line-height: 1.2;
    }

    /* Window / Jendela Aplikasi */
    .app-window {
      position: absolute;
      top: 50px;
      left: 100px;
      width: 900px;
      height: 560px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      border: 1px solid #ddd;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .window-header {
      height: 38px;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid #e0e0e0;
    }

    .window-title {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 28px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #555;
    }

    .win-btn:hover {
      background: #e2e2e2;
    }

    .win-btn.close:hover {
      background: #e81123;
      color: white;
    }

    .window-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .window-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .open-external-bar {
      height: 28px;
      background: #fafafa;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
    }

    .open-external-bar a {
      font-size: 11px;
      color: #0067b8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .open-external-bar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body onclick="playStartupOnce()">

  <!-- Audio Startup Windows 11 Asli -->
  <audio id="startup-sound" preload="auto">
    <source src="https://raw.githubusercontent.com/redphx/win11-sounds/main/Windows%20Startup.wav" type="audio/wav">
  </audio>

  <!-- Area Desktop -->
  <div id="desktop" onclick="closeStartMenu()">
    <!-- Icon shortcut akan dibuat otomatis via Javascript -->
  </div>

  <!-- Start Menu Pop-up -->
  <div id="start-menu">
    <div class="start-header">Semua Aplikasi & Menu</div>
    <div class="start-grid" id="start-grid">
      <!-- Items dibuat dinamis via Javascript -->
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div></div>
    <div class="taskbar-center">
      <div class="taskbar-btn start-btn" onclick="toggleStartMenu(event)" title="Start">
        <i class="bi bi-microsoft"></i>
      </div>
      <div class="taskbar-btn" onclick="openAllInNewTabs()" title="Buka Semua Menu">
        <i class="bi bi-grid-fill" style="color: #00a4ef;"></i>
      </div>
      <div class="taskbar-btn" onclick="playSoundManually()" title="Mainkan Suara Windows">
        <i class="bi bi-volume-up-fill" style="color: #107c41;"></i>
      </div>
    </div>
    <div class="taskbar-right">
      <div id="clock">12:00 PM</div>
      <i class="bi bi-wifi"></i>
      <i class="bi bi-volume-up"></i>
      <i class="bi bi-battery-charging"></i>
    </div>
  </div>

  <script>
    // 14 Data Menu / Link yang Anda berikan
    const apps = [
      { name: "Index / Beranda", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=index", icon: "bi-house-door-fill", color: "#0078d4" },
      { name: "Dashboard Utama", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard", icon: "bi-speedometer2", color: "#ff8c00" },
      { name: "Input Kerusakan", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=kerusakan", icon: "bi-exclamation-triangle-fill", color: "#d83b01" },
      { name: "Jadwal Kerusakan", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=jadwal-kerusakan", icon: "bi-calendar-x-fill", color: "#e81123" },
      { name: "PLTS Dashboard", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=plts-dashboard", icon: "bi-sun-fill", color: "#ffb900" },
      { name: "Energi Dashboard", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=energi-dashboard", icon: "bi-lightning-charge-fill", color: "#00cc6a" },
      { name: "BAST Form", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=bast", icon: "bi-file-earmark-check-fill", color: "#107c41" },
      { name: "Dashboard BAST", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-bast", icon: "bi-card-checklist", color: "#00b294" },
      { name: "Dashboard ATM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-atm", icon: "bi-cash-coin", color: "#8764b8" },
      { name: "Perencanaan PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=perencanaan-pm", icon: "bi-calendar2-range-fill", color: "#004e8c" },
      { name: "Progres Jadwal PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=progres-jadwal-pm", icon: "bi-clock-history", color: "#b146c2" },
      { name: "Dashboard PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-pm", icon: "bi-pie-chart-fill", color: "#e3008c" },
      { name: "Checklist Harian PM", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=checklist-harian-pm", icon: "bi-ui-checks", color: "#008272" },
      { name: "Dashboard Checklist", url: "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec?page=dashboard-checklist-pm", icon: "bi-bar-chart-line-fill", color: "#0078d7" }
    ];

    // Buat Icon di Desktop & Start Menu
    const desktop = document.getElementById('desktop');
    const startGrid = document.getElementById('start-grid');

    apps.forEach((app, idx) => {
      // Desktop Icon
      const dItem = document.createElement('div');
      dItem.className = 'desktop-icon';
      dItem.title = app.name;
      dItem.ondblclick = () => openApp(app);
      dItem.onclick = (e) => { e.stopPropagation(); }; // Single click selection
      dItem.innerHTML = `<i class="bi ${app.icon}" style="color: ${app.color}"></i><span>${app.name}</span>`;
      desktop.appendChild(dItem);

      // Start Menu Item
      const sItem = document.createElement('div');
      sItem.className = 'start-item';
      sItem.onclick = () => { openApp(app); closeStartMenu(); };
      sItem.innerHTML = `<i class="bi ${app.icon}" style="color: ${app.color}"></i><span>${app.name}</span>`;
      startGrid.appendChild(sItem);
    });

    // Window Manager
    let zIndexCount = 100;
    function openApp(app) {
      zIndexCount++;
      const winId = 'win-' + Math.random().toString(36).substr(2, 9);
      
      const win = document.createElement('div');
      win.className = 'app-window';
      win.id = winId;
      win.style.zIndex = zIndexCount;
      win.style.top = `${60 + (zIndexCount % 10) * 20}px`;
      win.style.left = `${100 + (zIndexCount % 10) * 20}px`;
      
      win.innerHTML = `
        <div class="window-header" onmousedown="bringToFront('${winId}')">
          <div class="window-title">
            <i class="bi ${app.icon}" style="color: ${app.color}"></i> ${app.name}
          </div>
          <div class="window-controls">
            <div class="win-btn" onclick="maximizeWindow('${winId}')"><i class="bi bi-square"></i></div>
            <div class="win-btn close" onclick="closeWindow('${winId}')"><i class="bi bi-x-lg"></i></div>
          </div>
        </div>
        <div class="window-body">
          <iframe src="${app.url}" allowfullscreen></iframe>
        </div>
        <div class="open-external-bar">
          <a href="${app.url}" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Buka di Tab Baru</a>
        </div>
      `;

      document.body.appendChild(win);
      win.addEventListener('mousedown', () => bringToFront(winId));
    }

    function closeWindow(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function maximizeWindow(id) {
      const el = document.getElementById(id);
      if (el.style.width === '100vw') {
        el.style.width = '900px';
        el.style.height = '560px';
        el.style.top = '60px';
        el.style.left = '100px';
      } else {
        el.style.width = '100vw';
        el.style.height = 'calc(100vh - 48px)';
        el.style.top = '0';
        el.style.left = '0';
      }
    }

    function bringToFront(id) {
      zIndexCount++;
      const el = document.getElementById(id);
      if (el) el.style.zIndex = zIndexCount;
    }

    // Toggle Start Menu
    function toggleStartMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('start-menu');
      menu.classList.toggle('open');
    }

    function closeStartMenu() {
      document.getElementById('start-menu').classList.remove('open');
    }

    // Jam Taskbar
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = now.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
      document.getElementById('clock').innerHTML = `${timeStr}<br><span style="font-size:10px">${dateStr}</span>`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Suara Startup Otomatis
    let audioPlayed = false;
    function playStartupOnce() {
      if (!audioPlayed) {
        playSoundManually();
        audioPlayed = true;
      }
    }

    function playSoundManually() {
      const audio = document.getElementById('startup-sound');
      audio.currentTime = 0;
      audio.play().catch(() => {
        // Autoplay terblokir browser sampai user berinteraksi
      });
    }

    // Coba putar otomatis saat pertama dimuat
    window.addEventListener('load', () => {
      playSoundManually();
    });
  </script>
</body>
</html>
